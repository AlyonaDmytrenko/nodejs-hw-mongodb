tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update contact details by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    example: "686cdcec293e375b4b466ebe"
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Jhone Deer
          phoneNumber:
            type: string
            example: "+380000000007"
          email:
            type: string
            example: andriy7@example.com
          isFavourite:
            type: boolean
            example: true
          photo:
            type: string
            format: binary
            description: Optional contact photo file
          contactType:
            type: string
            description: Type of contact
            enum: [personal, work]
            example: personal
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
