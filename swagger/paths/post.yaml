tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create a new contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - photo
        properties:
          name:
            type: string
            description: Contact name
            example: John Deer
          phoneNumber:
            type: string
            description: Contact phone number
            example: '+380000000007'
          email:
            type: string
            description: Contact email address
            example: andriy7@example.com
          isFavourite:
            type: boolean
            description: Whether the contact is a favourite
            example: true
            default: false
          photo:
            type: string
            format: binary
            description: Contact photo file
          contactType:
            type: string
            description: Type of contact
            enum: [personal, work]
            example: personal
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully
            data:
              $ref: ../components/schemas/contact.yaml
  '400':
    $ref: ../components/responses/400.yaml
  '401':
    $ref: ../components/responses/401.yaml
  '500':
    $ref: ../components/responses/500.yaml
