tags:
  - Contacts
summary: Create contacts
operationId: createContacts
description: Create contacts
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - photo 
        properties:
          name:
            type: string
            description: Contact name
            example: John Deer
          phoneNumber:
            type: string
            description: Phone phoneNumber
            example: +380000000007
          email:
            type: string
            description: Contact email
            example: andriy7@example.com
          isFavourite:
            type: boolean
            description: Contact is Favourite
            example: true
            default: false
          photo:
            type: string
            format: binary
            description: Contact photo


      