tags:
  - Contacts
summary: Create contacts
operationId: createContacts
description: Create contacts
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-date:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - photo
        properties:
          name:
            type: string
            description: Contact name
            example: John Deer
          phoneNumber:
            type: string
            description: Phone number
            example: "+380000000007"
          email:
            type: string
            description: Contact email
            example: andriy7@example.com
          isFavourite:
            type: boolean
            description: Contact is favourite
            example: true
            default: false
          photo:
            type: string
            format: binary
            description: Contact photo
responses:
  '201':
    description: Created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully
            data:
              $ref: ../components/schemas/contact.yaml
  '400':
    $ref: ../components/responses/400.yaml
  '401':
    $ref: ../components/responses/401.yaml
  '500':
    $ref: ../components/responses/500.yaml

