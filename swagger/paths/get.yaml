tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of all contacts with optional filtering, sorting, and pagination.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
    description: Page number for pagination
  - in: query
    name: perPage
    schema:
      type: integer
      default: 10
    description: Number of contacts per page
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [name, email, createdAt]
    description: Field to sort contacts by
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
    description: Sort order (ascending or descending)
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter contacts by favourite status
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter contacts by contact type
responses:
  '200':
    description: Successfully retrieved contacts list
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts
            data:
              type: object
              required:
                - contacts
                - page
                - perPage
                - totalItems
                - totalPages
              properties:
                contacts:
                  type: array
                  description: List of contacts
                  items:
                    $ref: ../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                  description: Current page number
                perPage:
                  type: integer
                  example: 10
                  description: Number of contacts per page
                totalItems:
                  type: integer
                  example: 57
                  description: Total number of contacts
                totalPages:
                  type: integer
                  example: 6
                  description: Total number of pages available
          example:
            status: 200
            message: Successfully retrieved contacts
            data:
              contacts:
                - _id: '686cdcec293e375b4b466ebe'
                  name: 'John Deer'
                  phoneNumber: '+380000000007'
                  email: 'john.deer@example.com'
                  # isFavourite: true
                  contactType: 'personal'
                  photo: 'https://example.com/uploads/john.jpg'
                  createdAt: '2025-10-20T10:15:30.000Z'
                  updatedAt: '2025-10-22T09:12:10.000Z'
              page: 1
              perPage: 10
              totalItems: 57
              totalPages: 6
  '401':
    $ref: ../components/responses/401.yaml
  '500':
    $ref: ../components/responses/500.yaml
